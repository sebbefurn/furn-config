# ~/.tmux.conf — managed by furn-config (stow tmux)

# ---- Prefix: C-Space (frees C-b, no clash with zsh Ctrl-A) ----
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- General ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"   # truecolor
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10            # snappy <Esc> for vim
set -g focus-events on
set -g set-clipboard on

# ---- vi keys ----
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind Enter copy-mode

# ---- Splits keep cwd; | and - ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Resize with prefix + HJKL ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Reload ----
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# ---- Gruvbox dark status (inline, no theme plugin) ----
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left "#[bg=#fabd2f,fg=#282828,bold] #S #[bg=#3c3836,fg=#fabd2f]"
set -g status-left-length 30
set -g status-right "#[fg=#a89984]%Y-%m-%d #[fg=#fabd2f]%H:%M "
setw -g window-status-current-style "bg=#504945,fg=#fabd2f,bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-format " #I:#W#F "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828"

# ---- Plugins (TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tpope/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across vim & tmux

# Keep this line at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
