# ~/.config/kitty/kitty.conf — managed by furn-config (stow kitty)
# kitty stays minimal on purpose: tmux owns multiplexing.

# ---- Font ----
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# ---- Theme ----
include          gruvbox-dark.conf

# ---- Shell ----
# Always launch zsh. Don't rely on kitty's default ('.' follows $SHELL), because
# $SHELL lags behind `chsh` until the next full login.
shell zsh

# ---- Appearance ----
remember_window_size   no
background_opacity     1.0
cursor_shape           block
cursor_blink_interval  0
scrollback_lines       10000
window_padding_width   6
enable_audio_bell      no
confirm_os_window_close 0

# ---- Clipboard ----
copy_on_select    yes
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ---- Font size shortcuts ----
map ctrl+shift+plus   change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0
